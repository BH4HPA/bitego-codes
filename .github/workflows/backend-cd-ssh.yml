name: Backend CD (SSH)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Docker image tag to deploy (default: short sha)"
        required: false
        type: string

concurrency:
  group: backend-cd-ssh-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      DEPLOY_SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
      DEPLOY_SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT }}
      DEPLOY_SSH_USER: ${{ secrets.DEPLOY_SSH_USER }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_WORKDIR: ${{ secrets.DEPLOY_WORKDIR }}
      TAG_INPUT: ${{ github.event.inputs.tag }}
    steps:
      - name: Compute tag
        id: tag
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${TAG_INPUT:-}" ]]; then
            echo "value=${TAG_INPUT}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Deploy on server
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${DEPLOY_SSH_HOST:-}" || -z "${DEPLOY_SSH_USER:-}" || -z "${DEPLOY_WORKDIR:-}" ]]; then
            echo "DEPLOY_SSH_HOST/DEPLOY_SSH_USER/DEPLOY_WORKDIR secrets are required" >&2
            exit 1
          fi
          PORT="${DEPLOY_SSH_PORT:-22}"
          SSH_OPTS=(-p "$PORT" -o StrictHostKeyChecking=no)
          ssh "${SSH_OPTS[@]}" "${DEPLOY_SSH_USER}@${DEPLOY_SSH_HOST}" \
            "cd '${DEPLOY_WORKDIR}' && bash ci/deploy-backend.sh '${{ steps.tag.outputs.value }}'"
