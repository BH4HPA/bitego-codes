name: Web Admin CI

on:
  pull_request:
    paths:
      - "projects/web-admin/**"
      - "!projects/web-admin/README.md"
      - ".github/workflows/webadmin-ci.yml"
  workflow_dispatch:

concurrency:
  group: webadmin-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint_test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"

      - name: Enable Corepack (Yarn)
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare yarn@4.13.0 --activate
          yarn --version

      - name: Cache Yarn (Berry)
        uses: actions/cache@v4
        with:
          path: |
            ~/.yarn/berry/cache
          key: yarn-berry-${{ runner.os }}-webadmin-${{ hashFiles('projects/web-admin/yarn.lock') }}
          restore-keys: |
            yarn-berry-${{ runner.os }}-webadmin-
            yarn-berry-${{ runner.os }}-

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          cd projects/web-admin
          yarn install --immutable

      - name: Lint
        shell: bash
        run: |
          set -euo pipefail
          cd projects/web-admin
          yarn lint
          yarn format:check

      - name: Test
        shell: bash
        run: |
          set -euo pipefail
          cd projects/web-admin
          yarn test
